server.servlet.context-path=/ispadmin-acs
spring.datasource.url=jdbc:mysql://mysql:3306/prod_acs?useUnicode=yes&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.jpa.properties.hibernate.dialect=com.dscorp.wispadmin.shared.persistence.UnicodeCiMySQLDialect
spring.jpa.hibernate.ddl-auto=update
management.health.redis.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/acs
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
gigafiber.subsystems.acs.enabled=true
acs.enabled=true
acs.api-key=${ACS_API_KEY:dev-acs-key}
acs.genieacs-to-acs-api-key=${GENIEACS_TO_ACS_API_KEY:}
acs.gateway.internal-base-url=${ACS_GATEWAY_BASE_URL:http://127.0.0.1:8080/ispadmin-oltgateway}
acs.gateway.api-key=${ACS_TO_GATEWAY_API_KEY:}
acs.client-enabled=false
acs.provisioning-baseline-key=${PROVISIONING_ACS_BASELINE_KEY:${PROVISIONING_V2_ACS_BASELINE_KEY:}}
genieacs.enabled=${GENIEACS_ENABLED:false}
genieacs.nbi-base-url=${GENIEACS_NBI_BASE_URL:http://127.0.0.1:7557}
genieacs.v2-publish-enabled=${GENIEACS_V2_PUBLISH_ENABLED:false}
genieacs.wait-timeout-ms=${GENIEACS_WAIT_TIMEOUT_MS:90000}
genieacs.offline-wait-timeout-ms=${GENIEACS_OFFLINE_WAIT_TIMEOUT_MS:15000}
genieacs.poll-interval-ms=${GENIEACS_POLL_INTERVAL_MS:5000}
genieacs.task-timeout-ms=${GENIEACS_TASK_TIMEOUT_MS:30000}
genieacs.connect-timeout-ms=${GENIEACS_CONNECT_TIMEOUT_MS:5000}
genieacs.vparams.enabled=${GENIEACS_VPARAMS_ENABLED:false}
