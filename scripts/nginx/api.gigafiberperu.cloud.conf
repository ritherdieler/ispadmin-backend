upstream gigafiber_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.gigafiberperu.cloud;

    # Certbot ampliará este bloque con listen 443 ssl automáticamente.
    # No agregar manualmente los bloques SSL aquí; Certbot lo hace con --nginx.

    location /ispadmin/ws {
        include snippets/websocket-backend.conf;
        proxy_pass http://gigafiber_backend;
    }

    location / {
        include snippets/proxy-backend.conf;
        proxy_pass http://gigafiber_backend;
    }
}
