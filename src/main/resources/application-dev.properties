# GenieACS NBI (TR-069) — deshabilitado en dev por defecto; túnel SSH a 7557 si se prueba
genieacs.enabled=${GENIEACS_ENABLED:false}
genieacs.nbi-base-url=${GENIEACS_NBI_BASE_URL:http://127.0.0.1:7557}
genieacs.wait-timeout-ms=${GENIEACS_WAIT_TIMEOUT_MS:90000}
genieacs.offline-wait-timeout-ms=${GENIEACS_OFFLINE_WAIT_TIMEOUT_MS:15000}
genieacs.poll-interval-ms=${GENIEACS_POLL_INTERVAL_MS:5000}
genieacs.task-timeout-ms=${GENIEACS_TASK_TIMEOUT_MS:30000}
genieacs.connect-timeout-ms=${GENIEACS_CONNECT_TIMEOUT_MS:5000}
genieacs.default-dns=${GENIEACS_DEFAULT_DNS:8.8.8.8,8.8.4.4}
genieacs.wan-vlan-id=${GENIEACS_WAN_VLAN_ID:1}
genieacs.staging-wan-index=${GENIEACS_STAGING_WAN_INDEX:1}
genieacs.client-wan-index=${GENIEACS_CLIENT_WAN_INDEX:2}
# Nombre WAN cliente: default en GenieAcsProperties / application.properties (no usar {vlan} como default de ${ENV:...})
genieacs.log-curl=${GENIEACS_LOG_CURL:false}

# Separate telemetry and event consumers by environment.
gigafiber.redis.namespace=dev
