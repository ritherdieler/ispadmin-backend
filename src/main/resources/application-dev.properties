# Login facial por foto. Android solo envia imagen; DJL genera el descriptor en Java.
# El modelo se carga desde disco para no depender de internet al iniciar el backend.
face.login.djl-model-path=classpath:models/face_feature.zip
face.login.djl-model-name=face_feature
face.login.djl-detector-model-path=classpath:models/ultranet.zip
face.login.djl-detector-model-name=ultranet

# Motor de embeddings facial intercambiable. Default = modelo PyTorch actual (sin cambios de comportamiento).
# Para activar ArcFace/InsightFace: engine=OnnxRuntime, alignment=ARCFACE, input-size=112,
# model-path=classpath:models/arcface_w600k_mbf.onnx, normalize=0.5,0.5,0.5,0.5,0.5,0.5 y re-enrolar a todos.
face.embedding.engine=OnnxRuntime
face.embedding.model-path=classpath:models/arcface_w600k_mbf.onnx
face.embedding.model-name=arcface_w600k_mbf
face.embedding.input-size=112
face.embedding.alignment=ARCFACE
face.embedding.normalize=0.5,0.5,0.5,0.5,0.5,0.5
face.embedding.metric=COSINE_SIMILARITY
face.embedding.l2-normalize=true

face.recognition.detector.confidence-threshold=0.70
face.recognition.detector.nms-threshold=0.45
face.recognition.detector.face-margin-ratio=0.20
face.recognition.detector.min-face-width-ratio=0.20
face.recognition.quality.min-image-size=160
face.recognition.quality.min-brightness=14
face.recognition.quality.max-brightness=230
face.recognition.quality.min-skin-ratio=0.008
face.recognition.quality.min-edge-ratio=0.003
face.recognition.matching.photo-similarity-threshold=0.82
face.recognition.matching.photo-min-margin=0.06
face.recognition.matching.offline-threshold=0.84
face.recognition.matching.offline-min-margin=0.06
face.recognition.matching.euclidean-threshold=0.48
face.recognition.matching.euclidean-min-margin=0.06
face.recognition.matching.cache-ttl-ms=60000
face.recognition.matching.offline-metric=COSINE_SIMILARITY
face.recognition.matching.offline-descriptor-size=512
face.recognition.matching.quality-weighted-matching=true
face.recognition.matching.quality-weight-min=0.78
face.recognition.liveness.enabled=true
face.recognition.liveness.min-laplacian-variance=24
face.recognition.liveness.min-color-variance=9
# Deteccion de pantalla/moire: opt-in hasta calibrar el umbral con fotos reales.
face.recognition.liveness.screen-detection-enabled=false
face.recognition.liveness.max-moire-ratio=0.50
# Logging estructurado de matching para analisis posterior (incluye top-N de candidatos).
face.recognition.metrics.enabled=true
face.recognition.metrics.ranked-top-n=5

# Nivel B anti-spoofing: reto activo (giro de cabeza) + challengeToken de un solo uso.
# La marcacion (verify/photo) exige token valido; identify/photo no lo exige para no bloquear el loop en vivo.
face.challenge.enabled=true
face.challenge.ttl-ms=60000
face.challenge.require-for-verify=true
face.challenge.require-for-identify=false

# Permite recibir la foto facial comprimida desde Android sin superar el limite por defecto de 1MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

