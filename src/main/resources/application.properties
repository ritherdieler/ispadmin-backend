## Configuración de pagos - se sobrescribe según el profile
# Las configuraciones específicas están en application-dev.properties y application-prod.properties

subscription.borne.capacity-check-enabled=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: Micrometer se usa en proceso (MeterRegistry). Sin exposicion HTTP salvo health.
management.endpoints.web.exposure.include=health

# Pool de hilos para @Scheduled (evita contencion entre flush APM/spans y muestreo de sistema)
spring.task.scheduling.pool.size=2

# ==========================================================================
# Buscador de suscripciones (arquitectura de puertos y adaptadores)
# Propiedades genericas agnosticas del motor + especificas del adaptador.
# ==========================================================================
search.enabled=${SEARCH_ENABLED:true}
search.provider=${SEARCH_PROVIDER:meilisearch}
search.index=${SEARCH_INDEX:subscriptions}
search.reconciliation.interval-ms=${SEARCH_RECONCILIATION_INTERVAL_MS:1800000}
search.reconciliation.initial-delay-ms=${SEARCH_RECONCILIATION_INITIAL_DELAY_MS:1800000}

subscription.provision.reconciliation.interval-ms=${SUBSCRIPTION_PROVISION_RECONCILIATION_INTERVAL_MS:300000}
subscription.provision.reconciliation.initial-delay-ms=${SUBSCRIPTION_PROVISION_RECONCILIATION_INITIAL_DELAY_MS:60000}

# Adaptador Meilisearch (solo activo con search.provider=meilisearch)
search.meili.host=${MEILI_HOST:http://localhost:7700}
search.meili.api-key=${MEILI_MASTER_KEY:}

# ==========================================================================
# Observabilidad (modulo aislado com.dscorp.wispadmin.observability)
# Todas las properties bajo el prefijo observability.* para facilitar la
# futura extraccion del hub a un servicio independiente.
# ==========================================================================
observability.enabled=true
observability.release=${APP_RELEASE:}
observability.internal-report-enabled=true
observability.max-events-per-batch=100
observability.max-payload-bytes=2000000
observability.rate-limit-per-minute=6000

# Almacenamiento de session replays (blob gzip en disco)
observability.replay.storage-dir=./data/observability/replays
observability.replay.max-upload-bytes=15000000

# Simbolizacion de stacktraces (source maps / mapping ProGuard-R8)
observability.symbols.enabled=true
observability.symbols.storage-dir=./data/observability/symbols
observability.symbols.max-upload-bytes=60000000

# Retencion (dias)
observability.retention.event-days=30
observability.retention.replay-days=14
observability.retention.metric-days=7
observability.retention.resolved-issue-days=90
observability.retention.span-days=7
observability.retention.symbol-days=120
observability.retention.system-metric-days=7
observability.retention.rum-metric-days=7

# APM de endpoints
observability.metrics.enabled=true
observability.metrics.max-samples-per-bucket=4000

# RUM Web Vitals
observability.rum.enabled=true
observability.rum.max-samples-per-bucket=4000
observability.rum.publish-live=true
observability.rum.allowed-metrics=LCP,INP,CLS,FCP,TTFB

# Metricas de infraestructura/JVM + pool de conexiones (muestreo periodico)
observability.system.enabled=true
observability.system.sample-interval-ms=15000
observability.system.publish-live=true

# Trazado distribuido (waterfall de spans)
observability.tracing.enabled=true
observability.tracing.sample-rate=1.0
observability.tracing.max-spans-per-trace=300
observability.tracing.max-buffered-spans=20000

# Integracion Jira (credenciales SOLO por env/properties de entorno, nunca en el repo)
observability.jira.enabled=false
observability.jira.base-url=${OBS_JIRA_BASE_URL:}
observability.jira.email=${OBS_JIRA_EMAIL:}
observability.jira.api-token=${OBS_JIRA_API_TOKEN:}
observability.jira.project-key=${OBS_JIRA_PROJECT_KEY:}
observability.jira.issue-type=${OBS_JIRA_ISSUE_TYPE:Bug}
observability.jira.dashboard-base-url=${OBS_DASHBOARD_BASE_URL:}
observability.jira.priority-by-severity.fatal=Highest
observability.jira.priority-by-severity.error=High
observability.jira.priority-by-severity.warning=Medium
observability.jira.priority-by-severity.info=Low

# Abstraccion de issue tracker (neutral). Proveedor activo y secreto del webhook entrante.
# Migracion: las claves observability.jira.* siguen soportadas como fallback (deprecadas);
# preferir observability.tracker.jira.* cuando se configure un nuevo entorno.
observability.tracker.provider=${OBS_TRACKER_PROVIDER:jira}
observability.tracker.webhook.secret=${OBS_TRACKER_WEBHOOK_SECRET:}

# Sesion de lectura/gestion del dashboard (token HMAC firmado emitido en el login ADMIN)
observability.session.secret=${OBS_SESSION_SECRET:}
observability.session.ttl-minutes=${OBS_SESSION_TTL_MIN:720}
observability.session.refresh-ttl-minutes=${OBS_SESSION_REFRESH_TTL_MIN:43200}

# GenieACS NBI (TR-069 post-install)
genieacs.enabled=false
genieacs.nbi-base-url=http://127.0.0.1:7557
genieacs.wait-timeout-ms=90000
genieacs.offline-wait-timeout-ms=15000
genieacs.poll-interval-ms=5000
genieacs.task-timeout-ms=30000
genieacs.connect-timeout-ms=5000
genieacs.default-dns=8.8.8.8,8.8.4.4
genieacs.wan-vlan-id=1
# Dual-WAN: WCD.1 preconfig TR-069 (intocable); WCD.2 Internet del abonado
genieacs.staging-wan-index=1
genieacs.client-wan-index=2
genieacs.client-wan-name-pattern=2_INTERNET_R_VID_{vlan}
# true = loguea cada POST NBI como curl y response (grep "[GenieACS curl]" / "[GenieACS response]")
genieacs.log-curl=false

traffic.poll.enabled=true
traffic.poll.interval-ms=300000
traffic.poll.initial-delay-ms=120000
traffic.poll.bucket-minutes=5
# El poll de consumo usa siempre RouterOS real (bean trafficPollMikrotikClient), aunque mikrotik.connection.mock.enabled=true
traffic.retention.raw-days=14
traffic.retention.hourly-days=90
traffic.retention.daily-days=1095
traffic.retention.network-hour-days=400
