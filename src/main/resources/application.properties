# Configuración general compartida por todos los profiles.
# Valores de entorno (secretos, hosts, paths) van en application-dev/prod.properties.

server.port=8080
server.servlet.context-path=/ispadmin
spring.profiles.active=dev,local

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.mysql.MySQL56InnoDBSpatialDialect
app.timezone=America/Lima
spring.jackson.time-zone=${app.timezone}
spring.jpa.properties.hibernate.jdbc.time_zone=${app.timezone}

subscription.borne.capacity-check-enabled=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health
spring.task.scheduling.pool.size=2

# Face recognition (defaults compartidos)
face.login.djl-detector-model-path=classpath:models/ultranet.zip
face.login.djl-detector-model-name=ultranet
face.embedding.engine=OnnxRuntime
face.embedding.model-path=classpath:models/arcface_w600k_mbf.onnx
face.embedding.model-name=arcface_w600k_mbf
face.embedding.input-size=112
face.embedding.alignment=ARCFACE
face.embedding.normalize=0.5,0.5,0.5,0.5,0.5,0.5
face.embedding.metric=COSINE_SIMILARITY
face.embedding.l2-normalize=true
face.recognition.detector.confidence-threshold=0.70
face.recognition.detector.nms-threshold=0.45
face.recognition.detector.face-margin-ratio=0.20
face.recognition.detector.min-face-width-ratio=0.20
face.recognition.quality.min-image-size=160
face.recognition.quality.min-brightness=14
face.recognition.quality.max-brightness=230
face.recognition.quality.min-skin-ratio=0.008
face.recognition.quality.min-edge-ratio=0.003
face.recognition.matching.photo-similarity-threshold=0.82
face.recognition.matching.photo-min-margin=0.06
face.recognition.matching.offline-threshold=0.84
face.recognition.matching.offline-min-margin=0.06
face.recognition.matching.euclidean-threshold=0.48
face.recognition.matching.euclidean-min-margin=0.06
face.recognition.matching.cache-ttl-ms=60000
face.recognition.matching.offline-metric=COSINE_SIMILARITY
face.recognition.matching.offline-descriptor-size=512
face.recognition.matching.quality-weighted-matching=true
face.recognition.matching.quality-weight-min=0.78
face.recognition.liveness.enabled=true
face.recognition.liveness.min-laplacian-variance=24
face.recognition.liveness.min-color-variance=9
face.recognition.liveness.screen-detection-enabled=false
face.recognition.liveness.max-moire-ratio=0.50
face.recognition.metrics.enabled=true
face.recognition.metrics.ranked-top-n=5
face.challenge.enabled=true
face.challenge.ttl-ms=60000
face.challenge.require-for-verify=true
face.challenge.require-for-identify=false

# Search (defaults; host/api-key por profile)
search.enabled=true
search.provider=meilisearch
search.index=subscriptions
search.reconciliation.interval-ms=1800000
search.reconciliation.initial-delay-ms=1800000

# Observabilidad (defaults de feature; secretos/paths por profile)
observability.enabled=true
observability.internal-report-enabled=true
observability.max-events-per-batch=100
observability.max-payload-bytes=2000000
observability.rate-limit-per-minute=6000
observability.replay.max-upload-bytes=15000000
observability.symbols.enabled=true
observability.symbols.max-upload-bytes=60000000
observability.retention.event-days=30
observability.retention.replay-days=14
observability.retention.metric-days=7
observability.retention.resolved-issue-days=90
observability.retention.span-days=7
observability.retention.symbol-days=120
observability.retention.system-metric-days=7
observability.retention.rum-metric-days=7
observability.metrics.enabled=true
observability.metrics.max-samples-per-bucket=4000
observability.rum.enabled=true
observability.rum.max-samples-per-bucket=4000
observability.rum.publish-live=true
observability.rum.allowed-metrics=LCP,INP,CLS,FCP,TTFB
observability.system.enabled=true
observability.system.sample-interval-ms=15000
observability.system.publish-live=true
observability.tracing.enabled=true
observability.tracing.sample-rate=1.0
observability.tracing.max-spans-per-trace=300
observability.tracing.max-buffered-spans=20000
observability.jira.priority-by-severity.fatal=Highest
observability.jira.priority-by-severity.error=High
observability.jira.priority-by-severity.warning=Medium
observability.jira.priority-by-severity.info=Low
observability.session.ttl-minutes=720
observability.session.refresh-ttl-minutes=43200

olt.gateway.enabled=false
olt.gateway.mock.enabled=true
olt.gateway.api-key=${OLT_GATEWAY_API_KEY:}
olt.gateway.host=${OLT_GATEWAY_HOST:10.11.104.2}
olt.gateway.port=22
olt.gateway.username=${OLT_GATEWAY_USER:olt-admin}
olt.gateway.password=${OLT_GATEWAY_PASSWORD:}
olt.gateway.olt-id=gigafiber-ma5608t
olt.gateway.ssh.legacy-algorithms=true
olt.gateway.session.pool-size=1
olt.gateway.session.keepalive-enabled=true
olt.gateway.session.keepalive-interval-ms=60000
olt.gateway.session.keepalive-command=display clock
olt.gateway.session.health-timeout-ms=5000
olt.gateway.session.ssh-idle-timeout-minutes=0
olt.gateway.command-timeout-ms=30000
olt.gateway.writes.enabled=false
olt.gateway.writes.default-line-profile-id=10
olt.gateway.writes.default-service-profile-id=10
olt.gateway.sync.inventory-enabled=true
olt.gateway.sync.inventory-interval-ms=600000
olt.gateway.sync.inventory-initial-delay-ms=30000
olt.gateway.sync.signal-enabled=true
olt.gateway.sync.signal-interval-ms=600000
olt.gateway.sync.signal-initial-delay-ms=90000
olt.gateway.sync.skip-when-write-running=true

olt.service.provider=smartolt
olt.service.auth-header=

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.packages-to-scan=com.dscorp.wispadmin.oltgateway
springdoc.paths-to-match=/api/olt-gateway/**
