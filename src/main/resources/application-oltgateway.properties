server.servlet.context-path=/ispadmin-oltgateway
spring.datasource.url=jdbc:mysql://mysql:3306/prod_oltgateway?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.hibernate.ddl-auto=update
management.health.redis.enabled=false
gigafiber.subsystems.oltgateway.enabled=true
gigafiber.scheduling.enabled=true
olt.gateway.enabled=true
olt.gateway.client-enabled=false
olt.gateway.internal-base-url=
olt.gateway.api-key=${OLT_GATEWAY_API_KEY:dev-olt-gateway-key}
olt.gateway.acs.enabled=${OLT_GATEWAY_ACS_ENABLED:true}
olt.gateway.acs.internal-base-url=${OLT_GATEWAY_ACS_BASE_URL:http://127.0.0.1:8080/ispadmin-acs}
olt.gateway.acs.api-key=${ACS_API_KEY:dev-acs-key}
gigafiber.redis.enabled=true
gigafiber.redis.host=${REDIS_HOST:redis}
gigafiber.redis.port=${REDIS_PORT:6379}
gigafiber.redis.password=${REDIS_PASSWORD:}

olt.service.base-url=${OLT_SERVICE_BASE_URL:https://gigafiberperu.smartolt.com/api/}
olt.service.api-key=${OLT_SERVICE_API_KEY:}
olt.service.connect-timeout-ms=${OLT_SERVICE_CONNECT_TIMEOUT_MS:5000}
olt.service.read-timeout-ms=${OLT_SERVICE_READ_TIMEOUT_MS:15000}
olt.provider.authorize=${OLT_PROVIDER_AUTHORIZE:GATEWAY}
olt.provider.delete=${OLT_PROVIDER_DELETE:GATEWAY}
olt.provider.reboot=${OLT_PROVIDER_REBOOT:GATEWAY}
olt.provider.move=${OLT_PROVIDER_MOVE:GATEWAY}
olt.provider.authorize-shadow=${OLT_PROVIDER_AUTHORIZE_SHADOW:false}

olt.gateway.writes.custom-profile-bindings=${OLT_GATEWAY_CUSTOM_PROFILE_BINDINGS:Generic_1:1=3:2,Generic_1:100=6:13}
olt.gateway.writes.inbound-traffic-table-index=${OLT_GATEWAY_INBOUND_TRAFFIC_TABLE:8}
olt.gateway.writes.outbound-traffic-table-index=${OLT_GATEWAY_OUTBOUND_TRAFFIC_TABLE:9}
olt.gateway.smartolt-olt-id=${OLT_GATEWAY_SMARTOLT_OLT_ID:2}

# Keep this key stable to recover encrypted activation operations after restart.
olt.gateway.operation-secret=${OLT_GATEWAY_OPERATION_SECRET:${olt.gateway.api-key:}}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/oltgateway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
