server.servlet.context-path=/ispadmin-acs
spring.datasource.url=jdbc:mysql://mysql:3306/prod_acs?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.hibernate.ddl-auto=update
gigafiber.subsystems.acs.enabled=true
acs.enabled=true
acs.api-key=${ACS_API_KEY:dev-acs-key}
acs.client-enabled=false
acs.profiles.catalog=${ACS_PROFILES_CATALOG:}
genieacs.enabled=${GENIEACS_ENABLED:false}
genieacs.nbi-base-url=${GENIEACS_NBI_BASE_URL:http://127.0.0.1:7557}
genieacs.wait-timeout-ms=${GENIEACS_WAIT_TIMEOUT_MS:90000}
genieacs.offline-wait-timeout-ms=${GENIEACS_OFFLINE_WAIT_TIMEOUT_MS:15000}
genieacs.poll-interval-ms=${GENIEACS_POLL_INTERVAL_MS:5000}
genieacs.task-timeout-ms=${GENIEACS_TASK_TIMEOUT_MS:30000}
genieacs.connect-timeout-ms=${GENIEACS_CONNECT_TIMEOUT_MS:5000}
