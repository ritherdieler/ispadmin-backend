server.servlet.context-path=/ispadmin-traffic
spring.datasource.url=jdbc:mysql://mysql:3306/prod_traffic?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.hibernate.ddl-auto=update
management.health.redis.enabled=false
gigafiber.subsystems.traffic.enabled=true
traffic.client-enabled=false
traffic.core-base-url=http://127.0.0.1:8080/ispadmin
traffic.internal-base-url=
traffic.api-key=${TRAFFIC_API_KEY:dev-traffic-key}
traffic.router-seed.enabled=true
traffic.router-seed.source-schema=ispadmin
traffic.poll.enabled=true
gigafiber.scheduling.enabled=true
spring.flyway.enabled=false
