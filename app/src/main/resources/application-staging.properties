server.servlet.context-path=/ispadmin-staging

spring.datasource.url=jdbc:mysql://mysql:3306/ispadmin_staging?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true

spring.jpa.hibernate.ddl-auto=update

# Scheduler global off on purpose. The 7-day PPPoE quarantine job does not fire
# by cron here; invoke POST /admin/access-migration/quarantine/finish-due (ADMIN).
gigafiber.scheduling.enabled=false
gigafiber.environment.tag=stg
gigafiber.registration.timing.enabled=true
gigafiber.subsystems.observability.enabled=false
gigafiber.subsystems.acs.enabled=true
gigafiber.subsystems.oltgateway.enabled=true
gigafiber.subsystems.netdiag.enabled=false
gigafiber.subsystems.traffic.enabled=true
gigafiber.subsystems.servicehealth.enabled=false

traffic.api-key=${TRAFFIC_API_KEY:dev-traffic-key}
traffic.core-base-url=http://127.0.0.1:8080/ispadmin-staging
traffic.internal-base-url=http://127.0.0.1:8080/ispadmin-staging
traffic.client-enabled=true
traffic.router-seed.source-schema=ispadmin_staging

service.health.enabled=false
service.health.optical-enabled=false
service.health.acs-enabled=false
service.health.actions-enabled=false
service.health.config-enabled=false
service.health.correlation-enabled=false
service.health.shared-incidents-enabled=false
service.health.shared-incident-notifications-enabled=false
service.health.acs-wifi-sample-target-seconds=180
service.health.acs-gpv-cooldown-seconds=180

pppoe.new-subscriptions.enabled=true
pppoe.migration.quarantine-days=7

# HTTP client Core -> ACS WAR. Staging default true; --with acs also bakes it
# in application-subsystem.properties. This is NOT the ACS WAR itself.
acs.client-enabled=true
acs.internal-base-url=http://127.0.0.1:8080/ispadmin-staging
acs.api-key=${ACS_API_KEY:dev-acs-key}

olt.gateway.enabled=false
# HTTP client Core -> Gateway WAR. Default false so a Core-only deploy cannot
# talk to OLT. Deploy with --with oltgateway so subsystems.sh overlay sets this
# to true (client only; does not embed the satellite).
olt.gateway.client-enabled=true
olt.gateway.internal-base-url=http://127.0.0.1:8080/ispadmin-staging
olt.gateway.writes.enabled=false
olt.gateway.sync.inventory-enabled=false
olt.gateway.sync.signal-enabled=false
olt.gateway.sync.alarm-enabled=false
olt.gateway.sync.lab-optical-ssh-enabled=false
olt.gateway.snmp.trap.enabled=false

net.diag.enabled=false
net.diag.snmp.trap.udp-enabled=false
net.diag.syslog.udp-enabled=false

gigafiber.redis.enabled=${REDIS_ENABLED:true}
gigafiber.redis.host=${REDIS_HOST:redis}
gigafiber.redis.port=${REDIS_PORT:6379}
gigafiber.redis.password=${REDIS_PASSWORD:}

whatsapp.access-token=
whatsapp.webhook-verify-token=
whatsapp.welcome-on-registration.enabled=false
whatsapp.retention.enabled=false
whatsapp.inbound-alert.enabled=false
whatsapp.backoffice.async-batch-send=false

# Separate telemetry and event consumers by environment.
gigafiber.redis.namespace=stg

acs.datasource.url=${ACS_DATASOURCE_URL:jdbc:mysql://mysql:3306/stg_acs?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
acs.datasource.username=${ACS_DATASOURCE_USERNAME:root}
acs.datasource.password=${ACS_DATASOURCE_PASSWORD:${spring.datasource.password}}
acs.jpa.hibernate.ddl-auto=update
acs.flyway.enabled=true
acs.flyway.baseline-version=0
oltgateway.datasource.url=${OLTGATEWAY_DATASOURCE_URL:jdbc:mysql://mysql:3306/stg_oltgateway?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
oltgateway.datasource.username=${OLTGATEWAY_DATASOURCE_USERNAME:root}
oltgateway.datasource.password=${OLTGATEWAY_DATASOURCE_PASSWORD:${spring.datasource.password}}
oltgateway.jpa.hibernate.ddl-auto=update
oltgateway.flyway.enabled=true
oltgateway.flyway.baseline-version=0
traffic.datasource.url=${TRAFFIC_DATASOURCE_URL:jdbc:mysql://mysql:3306/stg_traffic?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
traffic.datasource.username=${TRAFFIC_DATASOURCE_USERNAME:root}
traffic.datasource.password=${TRAFFIC_DATASOURCE_PASSWORD:${spring.datasource.password}}
traffic.jpa.hibernate.ddl-auto=update

